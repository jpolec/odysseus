name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Credential and remote-access boundaries
        run: |
          python3 -m unittest -v \
            tests.test_environments.EnvironmentTests.test_secret_values_are_never_accepted_into_persistent_configuration \
            tests.test_environments.EnvironmentTests.test_host_credentials_require_explicit_allow_env \
            tests.test_server.ServerTests.test_optional_basic_auth_protects_reads
          if bin/odysseus --state-dir "$RUNNER_TEMP/remote-state" serve --host 0.0.0.0 --allow-remote --port 0 \
            >"$RUNNER_TEMP/remote.out" 2>"$RUNNER_TEMP/remote.err"; then
            echo 'Remote bind without authentication was accepted.' >&2
            exit 1
          fi
          grep -q -- '--allow-remote requires --auth-password-file' "$RUNNER_TEMP/remote.err"
      - name: Workflow and release governance
        run: python3 scripts/verify-release-consistency.py
