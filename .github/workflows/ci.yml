name: Fast CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          python3 -m compileall -q odysseus
          node --check web/app.js
          bash -n scripts/*.sh codex_session_manager.tmux
          git diff --check
      - name: Release consistency
        run: python3 scripts/verify-release-consistency.py

  compatibility:
    name: compatibility (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Import, version, and syntax compatibility
        run: |
          python3 -m unittest tests.test_cli.CLITests.test_start_is_a_serve_alias_and_version_is_current tests.test_cli.CLITests.test_version_subcommand_reports_compatibility_markers -v
          python3 -m compileall -q odysseus scripts/demo.py scripts/build-offline-package.py scripts/build-release-assets.py scripts/verify-release-consistency.py
