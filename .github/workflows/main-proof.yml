name: Main proof

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Full release proof
        run: scripts/release-proof.sh
