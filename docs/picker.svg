<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">tmux-codex-session-manager picker</title>
  <desc id="desc">A tmux popup running fzf with Codex sessions, status labels, age, project paths, and a live preview pane.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="chrome" x1="0" x2="1">
      <stop offset="0" stop-color="#20262f"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.8333333333)">
  <rect width="1440" height="900" fill="#0b0f14"/>
  <rect x="58" y="54" width="1324" height="792" rx="18" fill="#111822" filter="url(#shadow)"/>
  <rect x="58" y="54" width="1324" height="56" rx="18" fill="url(#chrome)"/>
  <circle cx="92" cy="82" r="8" fill="#ff5f57"/>
  <circle cx="118" cy="82" r="8" fill="#ffbd2e"/>
  <circle cx="144" cy="82" r="8" fill="#28c840"/>
  <text x="720" y="89" text-anchor="middle" fill="#b8c0cc" font-size="18">prefix + u - Codex sessions</text>
  <rect x="86" y="138" width="1268" height="670" rx="10" fill="#0d1117" stroke="#2a3340"/>
  <text x="118" y="181" fill="#d6dde8" font-size="22">Codex sessions - enter: jump - ctrl-x: kill</text>
  <line x1="86" y1="207" x2="1354" y2="207" stroke="#253040"/>
  <rect x="108" y="238" width="540" height="52" rx="6" fill="#1f6feb"/>
  <text x="132" y="272" fill="#ffcc66" font-size="23" font-weight="700">WAIT</text>
  <text x="226" y="272" fill="#f0f6fc" font-size="23">0m</text>
  <text x="300" y="272" fill="#ffffff" font-size="23">~/work/api</text>
  <text x="132" y="334" fill="#7ee787" font-size="23" font-weight="700">IDLE</text>
  <text x="226" y="334" fill="#8b949e" font-size="23">2m</text>
  <text x="300" y="334" fill="#d6dde8" font-size="23">~/work/web</text>
  <text x="132" y="396" fill="#8b949e" font-size="23" font-weight="700">????</text>
  <text x="226" y="396" fill="#8b949e" font-size="23">-</text>
  <text x="300" y="396" fill="#d6dde8" font-size="23">~/work/infra</text>
  <text x="132" y="458" fill="#ff7b72" font-size="23" font-weight="700">WORK</text>
  <text x="226" y="458" fill="#8b949e" font-size="23">9m</text>
  <text x="300" y="458" fill="#d6dde8" font-size="23">~/work/experiments</text>
  <text x="132" y="742" fill="#8b949e" font-size="20">4/4</text>
  <text x="224" y="742" fill="#8b949e" font-size="20">type to filter</text>
  <line x1="684" y1="207" x2="684" y2="808" stroke="#253040"/>
  <text x="716" y="247" fill="#8b949e" font-size="19">preview: codex-8a91c4e2</text>
  <text x="716" y="295" fill="#7ee787" font-size="21">$ codex</text>
  <text x="716" y="335" fill="#f0f6fc" font-size="21">Codex CLI</text>
  <text x="716" y="381" fill="#8b949e" font-size="21">cwd: /Users/jakub/work/api</text>
  <text x="716" y="434" fill="#f0f6fc" font-size="21">&gt; Refactor the auth middleware and run tests</text>
  <text x="716" y="488" fill="#ffcc66" font-size="21">approval needed</text>
  <text x="716" y="529" fill="#f0f6fc" font-size="21">run: pnpm test</text>
  <rect x="714" y="574" width="566" height="88" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="742" y="611" fill="#d6dde8" font-size="20">Do you want to allow this command?</text>
  <text x="742" y="647" fill="#8b949e" font-size="20">waiting for user input...</text>
  <text x="716" y="742" fill="#8b949e" font-size="20">capture-pane preview updates live</text>
  </g>
</svg>
