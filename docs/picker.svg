<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">tmux-codex-session-manager picker</title>
  <desc id="desc">A tmux popup running fzf with Codex sessions, status, managed or pane source, context, project paths, prompt titles, and a live preview pane.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="chrome" x1="0" x2="1">
      <stop offset="0" stop-color="#20262f"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
  </defs>
  <g transform="scale(0.8333333333)">
  <rect width="1440" height="900" fill="#0b0f14"/>
  <rect x="58" y="54" width="1324" height="792" rx="18" fill="#111822" filter="url(#shadow)"/>
  <rect x="58" y="54" width="1324" height="56" rx="18" fill="url(#chrome)"/>
  <circle cx="92" cy="82" r="8" fill="#ff5f57"/>
  <circle cx="118" cy="82" r="8" fill="#ffbd2e"/>
  <circle cx="144" cy="82" r="8" fill="#28c840"/>
  <text x="720" y="89" text-anchor="middle" fill="#b8c0cc" font-size="18">prefix + u - Codex popup manager</text>

  <rect x="86" y="138" width="1268" height="670" rx="10" fill="#0d1117" stroke="#2a3340"/>
  <text x="118" y="181" fill="#d6dde8" font-size="22">Codex sessions - enter: jump - ctrl-x: kill managed</text>
  <text x="118" y="218" fill="#8b949e" font-size="16">state kind age ctx path title target</text>
  <line x1="86" y1="236" x2="1354" y2="236" stroke="#253040"/>

  <rect x="108" y="264" width="552" height="54" rx="6" fill="#1f6feb"/>
  <text x="132" y="299" fill="#ffcc66" font-size="22" font-weight="700">WAIT</text>
  <text x="214" y="299" fill="#d2a8ff" font-size="22" font-weight="700">MGR</text>
  <text x="286" y="299" fill="#f0f6fc" font-size="22">0m</text>
  <text x="344" y="299" fill="#7ee787" font-size="22">73%</text>
  <text x="420" y="299" fill="#ffffff" font-size="22">~/work/api</text>
  <text x="132" y="356" fill="#7ee787" font-size="22" font-weight="700">IDLE</text>
  <text x="214" y="356" fill="#79c0ff" font-size="22" font-weight="700">PANE</text>
  <text x="286" y="356" fill="#8b949e" font-size="22">2m</text>
  <text x="344" y="356" fill="#7ee787" font-size="22">91%</text>
  <text x="420" y="356" fill="#d6dde8" font-size="22">~/work/web</text>
  <text x="132" y="413" fill="#ff7b72" font-size="22" font-weight="700">WORK</text>
  <text x="214" y="413" fill="#79c0ff" font-size="22" font-weight="700">PANE</text>
  <text x="286" y="413" fill="#8b949e" font-size="22">6m</text>
  <text x="344" y="413" fill="#7ee787" font-size="22">64%</text>
  <text x="420" y="413" fill="#d6dde8" font-size="22">~/work/tmux</text>
  <text x="132" y="470" fill="#8b949e" font-size="22" font-weight="700">????</text>
  <text x="214" y="470" fill="#79c0ff" font-size="22" font-weight="700">PANE</text>
  <text x="286" y="470" fill="#8b949e" font-size="22">-</text>
  <text x="344" y="470" fill="#8b949e" font-size="22">--</text>
  <text x="420" y="470" fill="#d6dde8" font-size="22">~/scratch</text>

  <text x="132" y="536" fill="#8b949e" font-size="18">title: approve pnpm test and update auth regression</text>
  <text x="132" y="574" fill="#8b949e" font-size="18">target: codex-8a91c4e2</text>
  <text x="132" y="742" fill="#8b949e" font-size="20">4/4</text>
  <text x="224" y="742" fill="#8b949e" font-size="20">type to filter</text>

  <line x1="684" y1="236" x2="684" y2="808" stroke="#253040"/>
  <text x="716" y="276" fill="#8b949e" font-size="19">preview: codex-8a91c4e2</text>
  <text x="716" y="324" fill="#7ee787" font-size="21">$ codex</text>
  <text x="716" y="364" fill="#f0f6fc" font-size="21">Codex CLI</text>
  <text x="716" y="410" fill="#8b949e" font-size="21">cwd: /Users/jakub/work/api</text>
  <text x="716" y="463" fill="#f0f6fc" font-size="21">&gt; Refactor the auth middleware and run tests</text>
  <text x="716" y="517" fill="#ffcc66" font-size="21">approval needed</text>
  <text x="716" y="558" fill="#f0f6fc" font-size="21">run: pnpm test</text>
  <rect x="714" y="603" width="566" height="88" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="742" y="640" fill="#d6dde8" font-size="20">Do you want to allow this command?</text>
  <text x="742" y="676" fill="#8b949e" font-size="20">waiting for user input...</text>
  <text x="716" y="742" fill="#8b949e" font-size="20">capture-pane preview updates live</text>
  </g>
</svg>
