<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Codex session in a tmux popup</title>
  <desc id="desc">A managed Codex CLI session running in a tmux popup over an existing project window.</desc>
  <defs>
    <filter id="popupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g transform="scale(0.8333333333)">
  <rect width="1440" height="900" fill="#0b0f14"/>
  <rect x="52" y="48" width="1336" height="804" rx="16" fill="#101720" stroke="#243041"/>
  <rect x="82" y="86" width="574" height="690" rx="10" fill="#0d1117" stroke="#253040"/>
  <rect x="684" y="86" width="674" height="690" rx="10" fill="#0d1117" stroke="#253040"/>

  <text x="108" y="130" fill="#8b949e" font-size="20">project window: ~/work/api</text>
  <text x="108" y="181" fill="#7ee787" font-size="20">$ rg -n "authMiddleware" src</text>
  <text x="108" y="223" fill="#f0f6fc" font-size="20">src/http/auth.ts:14:export function authMiddleware</text>
  <text x="108" y="265" fill="#f0f6fc" font-size="20">src/http/routes.ts:8:router.use(authMiddleware)</text>
  <text x="108" y="347" fill="#8b949e" font-size="20">$ git status --short</text>
  <text x="108" y="389" fill="#f0f6fc" font-size="20"> M src/http/auth.ts</text>
  <text x="108" y="431" fill="#f0f6fc" font-size="20"> M test/auth.test.ts</text>
  <text x="710" y="130" fill="#8b949e" font-size="20">notes.md</text>
  <text x="710" y="182" fill="#f0f6fc" font-size="20">- keep project context visible</text>
  <text x="710" y="224" fill="#f0f6fc" font-size="20">- Codex runs in a persistent tmux session</text>
  <text x="710" y="266" fill="#f0f6fc" font-size="20">- prefix+u returns to the global picker</text>
  <rect x="66" y="798" width="1308" height="38" rx="8" fill="#1f6feb"/>
  <text x="92" y="823" fill="#ffffff" font-size="18">tmux: 1 api  2 web  3 infra                      prefix+y opens managed Codex popup</text>

  <rect x="106" y="102" width="1228" height="680" rx="16" fill="#0d1117" stroke="#3a4556" filter="url(#popupShadow)"/>
  <rect x="106" y="102" width="1228" height="52" rx="16" fill="#161b22"/>
  <circle cx="139" cy="128" r="7" fill="#ff5f57"/>
  <circle cx="163" cy="128" r="7" fill="#ffbd2e"/>
  <circle cx="187" cy="128" r="7" fill="#28c840"/>
  <text x="720" y="136" text-anchor="middle" fill="#b8c0cc" font-size="18">codex-8a91c4e2 - managed popup - ~/work/api</text>

  <text x="216" y="206" fill="#7ee787" font-size="22">$ codex</text>
  <text x="216" y="258" fill="#f0f6fc" font-size="22">Codex CLI</text>
  <text x="216" y="301" fill="#8b949e" font-size="22">cwd: /Users/jakub/work/api</text>
  <text x="216" y="366" fill="#f0f6fc" font-size="22">&gt; Refactor auth middleware without changing public routes.</text>
  <text x="216" y="431" fill="#8b949e" font-size="22">reading src/http/auth.ts</text>
  <text x="216" y="474" fill="#8b949e" font-size="22">editing test/auth.test.ts</text>
  <text x="216" y="517" fill="#ffcc66" font-size="22">needs approval: pnpm test</text>
  <rect x="214" y="568" width="612" height="92" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="244" y="606" fill="#d6dde8" font-size="21">Allow command?</text>
  <text x="244" y="644" fill="#8b949e" font-size="21">Detach with prefix+d; resume from prefix+u.</text>
  <text x="216" y="719" fill="#8b949e" font-size="20">status hooks update WAIT / WORK / IDLE in the picker</text>
  </g>
</svg>
